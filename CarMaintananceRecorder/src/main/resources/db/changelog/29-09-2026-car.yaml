databaseChangeLog:
  - changeSet:
      id: 2
      author: martin.valchev
      changes:
        - createTable:
            tableName: car
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: car_id
                  type: bigint
                  constraints:
                    nullable: false
              - column:
                  name: owner_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_car_owner
                    references: car_owner(owner_id)
              - column:
                  name: make
                  type: varchar(50)
              - column:
                  name: model
                  type: varchar(30)
              - column:
                  name: vin
                  type: varchar(30)
              - column:
                  name: mileage
                  type: bigint
              - column:
                  name: car_type
                  type: varchar(30)
              - column:
                  name: fuel_type
                  type: varchar(20)
              - column:
                  name: insert_date
                  type: datetime
              - column:
                  name: modified_date
                  type: datetime