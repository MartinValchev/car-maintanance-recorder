databaseChangeLog:
  - changeSet:
      id: 3
      author: martin.valchev
      changes:
        - createTable:
            tableName: car_owner
            columns:
              - column:
                  name: id
                  type: uuid
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: owner_id
                  type: bigint
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: first_name
                  type: varchar(50)
              - column:
                  name: last_name
                  type: varchar(50)
              - column:
                  name: address
                  type: varchar(100)
              - column:
                  name: email
                  type: varchar(100)
              - column:
                  name: insert_date
                  type: datetime
              - column:
                  name: modified_date
                  type: datetime
        - addUniqueConstraint:
            tableName: car_owner
            columnNames: owner_id
            constraintName: uq_car_owner_owner_id